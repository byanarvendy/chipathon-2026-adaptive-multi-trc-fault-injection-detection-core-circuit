# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "TRC"
  team: "A48 HORE"
  discord: "@abem._"
  description: "Adaptive multi-TRC fault injection detection core"
  lvs_config: "lvs_config.json"

# ======================================================
# Pin definitions
# ======================================================
pins:
  - name: VSS
    io_type: ground

  - name: VDD
    io_type: power

  - name: iCLK
    io_type: input_schmitt

  - name: iRST
    io_type: input_cmos

  - name: iSPI_CS
    io_type: input_cmos

  - name: iSPI_SCK
    io_type: input_schmitt

  - name: iSPI_MOSI
    io_type: input_cmos

  - name: oSPI_MISO
    io_type: bidirectional

  - name: oINTERRUPT
    io_type: bidirectional